name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID (optional, defaults to latest)'
        required: false
        default: ''

jobs:
  submit:
    runs-on: macos-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup ASC API Key
        run: |
          mkdir -p ~/.config/eas
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.config/eas/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.config/eas/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            eas submit --platform ios --id ${{ github.event.inputs.build_id }} --non-interactive \
              --key-id ${{ secrets.ASC_KEY_ID }} \
              --issuer-id ${{ secrets.ASC_ISSUER_ID }}
          else
            eas submit --platform ios --latest --non-interactive \
              --key-id ${{ secrets.ASC_KEY_ID }} \
              --issuer-id ${{ secrets.ASC_ISSUER_ID }}
          fi
