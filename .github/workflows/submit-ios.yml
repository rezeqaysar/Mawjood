name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID (optional, defaults to latest)'
        required: false
        default: ''

jobs:
  submit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: .
        run: npm install

      - name: Setup ASC API Key
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > ./asc-key.p8
          chmod 600 ./asc-key.p8

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            eas submit --platform ios --id ${{ github.event.inputs.build_id }} --non-interactive --verbose
          else
            eas submit --platform ios --latest --non-interactive --verbose
          fi
