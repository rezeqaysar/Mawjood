# Mawjood CI — Phase B (reproducible foundation) + D-1 governance gates.
# Every push/PR must: install locked deps, typecheck, lint, run engine unit
# tests, prove all migrations apply on a FRESH database (incl. an idempotency
# re-run), prove RLS policies + auth gates hold, and build the web bundle.
# A migration that fails here never reaches a human's SQL editor.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One running CI per branch/PR: a new push cancels the stale run instead of
# stacking two checks that disagree about what "green" meant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: TypeScript — voice-engine
        run: npx tsc --noEmit -p packages/voice-engine

      - name: TypeScript — mobile
        run: npx tsc --noEmit -p apps/mobile

      - name: Lint — mobile
        run: npx expo lint
        working-directory: apps/mobile

      - name: Unit tests — shared engines
        # node strips TS types natively (no build step); deno-shim backs Deno.env
        run: node --import ./supabase/tests/deno-shim.mjs --test supabase/tests/unit.test.mjs

      - name: Eval — routing + memory corpora (Phase D)
        # 100% required: any red case is a behavior regression
        run: node supabase/tests/eval/run-eval.mjs

      - name: Migration check — fresh database
        # Also performs an idempotency re-run internally: applying the same
        # migrations twice must not error or change schema.
        run: node supabase/tests/migrate-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Web build
        run: npx expo export --platform web
        working-directory: apps/mobile

  secret-scan:
    # Scans the FULL git history, not just the working tree: a secret
    # committed (and later deleted) months ago is still in the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # gitleaks v8: --log-opts="--all" makes detect walk every commit.
          gitleaks-args: detect --redact --verbose --log-opts="--all"
          # Baseline config documents reviewed historical false positives
          # (Supabase ANON key in old bundles, Apple Issuer ID, storage
          # constants). New leaks outside it still fail the job.
          config-path: .gitleaks.toml

  vuln-scan:
    # NOTE: cannot be verified in the dev sandbox — the npm audit endpoint
    # is blocked there. CI runners are unrestricted, so this runs there.
    # Exit code: npm audit exits 1 when it finds >= --audit-level issues.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: Audit — fail on high+ vulnerabilities
        run: npm audit --audit-level=high

  rls-audit:
    # Runs the Row-Level Security audit against the SAME scratch database
    # the migration check builds: migrate first (builds mawjood_migtest),
    # then audit. Keeping both in one job avoids a second postgres service
    # and guarantees the audit sees the migrated schema.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        # pg is a root devDependency — the audit talks to the scratch DB
        run: npm ci

      - name: Build scratch database (migrate-check)
        run: node supabase/tests/migrate-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: RLS audit — policies hold on the migrated schema
        run: node supabase/tests/rls-audit.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  auth-gates:
    # Static audit of edge-function auth wiring (401/403/404 gating,
    # ownership proofs). No database needed — pure source analysis.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Auth gates check
        run: node supabase/tests/auth-gates-check.mjs

  e2e-smoke:
    # Playwright smoke test against the REAL Expo web export (not a mock):
    # installs chromium, builds the bundle, serves it, and asserts it loads
    # with HTTP 200, no uncaught errors, no failed same-origin assets, and
    # renders non-empty text.
    #
    # SCOPE (honest): smoke only. Full user journeys need a live backend
    # (Supabase auth/data); this proves the bundle is valid and servable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: Install Playwright Chromium
        # --with-deps needs apt; sudo is available on ubuntu-latest runners
        run: npx playwright install --with-deps chromium

      - name: Web build
        # Plain export (same as the `ci` job): the smoke test only needs a
        # working bundle; no baseUrl rewriting here.
        run: npx expo export --platform web
        working-directory: apps/mobile

      - name: Smoke test
        run: npx playwright test tests/e2e/smoke.spec.mjs --config=tests/e2e/playwright.config.mjs

  provenance:
    # Exact-commit verification: the CI result must be attributable to ONE
    # exact SHA. Fails on a dirty checkout (status --porcelain non-empty)
    # or whitespace errors (git diff --check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout + record exact SHA
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout is dirty"
            git status --porcelain
            exit 1
          fi
          git diff --check
          echo "### EXACT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
