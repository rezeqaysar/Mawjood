name: EAS Submit iOS

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit to TestFlight'
        required: true
        type: string

jobs:
  submit_ios:
    name: Submit app to TestFlight
    defaults:
      run:
        working_directory: ./apps/mobile
    steps:
      - name: Checkout
        uses: eas/checkout@v1

      - name: Setup Node
        uses: eas/setup-node@v1
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Submit to TestFlight
        run: eas submit --platform ios --id ${{ inputs.build_id }} --non-interactive
